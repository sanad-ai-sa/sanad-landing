<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ربط المتجر | سَنَد</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Cairo,system-ui,sans-serif;background:#FDFDFF;color:#1F2937}
  .card{max-width:440px;margin:24px;padding:36px 28px;text-align:center;border-radius:24px;background:rgba(255,255,255,.7);
        border:1px solid rgba(168,85,247,.18);box-shadow:0 20px 60px rgba(168,85,247,.12);backdrop-filter:blur(14px)}
  .ic{font-size:44px;line-height:1;margin-bottom:12px}
  h1{font-size:22px;margin:0 0 10px;font-weight:800}
  p{margin:0;color:#4B5563;line-height:1.9}
  .bar{height:4px;border-radius:4px;margin:22px auto 0;width:120px;background:linear-gradient(90deg,#EC4899,#A855F7,#FB923C)}
</style>
</head>
<body>
<main class="card" aria-live="polite">
  <div class="ic" id="ic">⏳</div>
  <h1 id="t">جاري ربط متجرك…</h1>
  <p id="m">لحظات بس.</p>
  <div class="bar"></div>
</main>
<script type="module">
// صفحة استقبال موافقة سلة: تحط {code, state} في Firestore (salla_auth) وبس.
// ما فيها أي سر: الرمز لحاله ما يفيد بدون مفتاح التطبيق السري المحفوظ عندنا.
import { firebaseConfig } from "../assets/firebase-config.js";
const V = "10.12.0";
const $ = (id) => document.getElementById(id);
const show = (ic, t, m) => { $("ic").textContent = ic; $("t").textContent = t; $("m").textContent = m; };
const q = new URLSearchParams(location.search);
const code = q.get("code") || "", state = q.get("state") || "";
history.replaceState(null, "", location.pathname);   // نشيل الرمز من شريط العنوان
if (q.get("error")) {
  show("✋", "ما تم الربط", "تم إلغاء الموافقة. تقدر ترجع للرابط اللي وصلك وتوافق من جديد.");
} else if (!/^[A-Za-z0-9._~-]{8,512}$/.test(code) || !/^[a-z0-9_-]{8,128}$/.test(state)) {
  show("⚠️", "الرابط غير مكتمل", "افتح رابط الربط اللي وصلك من سند مرة ثانية.");
} else {
  try {
    const [{ initializeApp }, fs] = await Promise.all([
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`),
    ]);
    const db = fs.getFirestore(initializeApp(firebaseConfig));
    await fs.addDoc(fs.collection(db, "salla_auth"), { code, state, at: fs.serverTimestamp() });
    show("✅", "تم ربط متجرك بنجاح", "أمين المستودع بيبدأ يقرأ منتجاتك وأسعارك خلال دقائق، ويوصلك تأكيد على الواتساب. تقدر تسكّر الصفحة.");
  } catch (e) {
    show("⚠️", "صار خطأ بسيط", "ما قدرنا نكمل الربط. افتح الرابط مرة ثانية، أو كلّم سند على الواتساب.");
  }
}
</script>
</body>
</html>
